{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}{{ titulo }}{% endblock %}
{% block shell %}
<main id="contenido" class="wrap" style="flex:1;display:grid;place-items:center">
  <div class="error-page">
    <div class="code" aria-hidden="true">{{ code }}</div>
    <h1 style="font-size:2rem">{{ titulo }}</h1>
    <p class="muted" style="max-width:46ch">{{ texto }}</p>
    <a class="btn btn--primary" href="{{ url_for('auth.raiz') }}">Volver al inicio</a>
  </div>
</main>
{% endblock %}
